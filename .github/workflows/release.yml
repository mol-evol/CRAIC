name: Build & publish wheels

# Build wheels + sdist on every tag, and publish them to PyPI when the tag is a
# version tag (e.g. v0.1.0), or when the workflow is run by hand from the Actions
# tab (to retry a release whose tagged run failed). Wheels are abi3, so one per
# platform covers CPython 3.9+.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A universal2 wheel is built for both Mac architectures, so both Rust
      # targets must be installed.
      - name: Add the Intel and Apple Silicon Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          # Linux builds inside a manylinux container with Rust preinstalled.
          # macOS builds a universal2 wheel (Intel + Apple Silicon); maturin
          # only knows it by its full name, universal2-apple-darwin.
          args: >-
            --release --out dist
            ${{ runner.os == 'macOS' && '--target universal2-apple-darwin' || '' }}
          manylinux: auto
      - name: Smoke-test the built wheel (imports + Rust core present)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The wheel from dist/ (not PyPI), plus numpy, which is all this check
          # imports; --no-index alone would fail on the other dependencies.
          pip install --no-index --no-deps --find-links=dist craic-msa
          pip install numpy
          # Run from outside the checkout, or Python imports the source tree
          # (which has no compiled core) instead of the installed wheel.
          cd "$RUNNER_TEMP"
          python -c "import craic, craic.accel as a; print('version', craic.__version__, 'backend', a.backend()); assert a.backend() == 'rust', 'published wheel must bundle the Rust core'"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Verify sdist excludes dev files and private paths
        run: |
          f=$(ls dist/*.tar.gz)
          echo "sdist contents:"; tar tzf "$f"
          # scratch files are only a problem at the top level (docs/assets has a
          # legitimate true-alignment.png)
          if tar tzf "$f" | grep -E '(^|/)update\.sh$|\.command$|^[^/]+/(alignment\.(fasta|png)|masked\.fasta)$'; then
            echo "ERROR: a dev/scratch file leaked into the sdist"; exit 1; fi
          if tar xzOf "$f" | grep -q "CloudStorage\|/Users/mbzjom"; then
            echo "ERROR: a private local path leaked into the sdist"; exit 1; fi
          echo "sdist is clean."
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      id-token: write          # PyPI Trusted Publishing (no token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
