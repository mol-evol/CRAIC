name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CRAIC (builds the Rust core) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q

  fallback:
    name: numpy-fallback (no Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately install runtime deps only (no Rust toolchain, no maturin
      # build), so the package imports its pure-NumPy fallback. This guards the
      # headline "runs anywhere without Rust" promise, which the Rust matrix
      # above cannot check (its parity tests skip when the core is absent).
      - name: Install runtime + test deps only
        run: |
          python -m pip install --upgrade pip
          pip install numpy biopython PySide6 pytest

      - name: Confirm the NumPy fallback is active, then run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from craic import accel; assert accel.backend() == 'numpy'; print('backend:', accel.backend())"
          pytest tests -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check craic tests
