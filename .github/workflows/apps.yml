name: Build double-clickable apps

# On a version tag, build unsigned, double-clickable bundles with PyInstaller for
# macOS / Windows / Linux and attach them to the GitHub Release. These need NO
# Python on the user's machine. They are UNSIGNED — see the install docs for the
# one-time "right-click → Open" step on macOS / "More info → Run anyway" on Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # create / update the GitHub Release and upload assets

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CRAIC (builds the Rust core) + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      # Bundle. --windowed = no console window; we explicitly pull in the compiled
      # Rust extension and Biopython's data files (BLOSUM62 etc.).
      - name: Build bundle
        run: >-
          pyinstaller --noconfirm --clean --windowed --name CRAIC
          --hidden-import craic._accel
          --collect-binaries craic
          --collect-data Bio
          packaging/launch.py

      - name: Package (macOS → .dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname CRAIC -srcfolder "dist/CRAIC.app" \
            -ov -format UDZO "CRAIC-macos.dmg"

      - name: Package (Windows → .zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CRAIC/* -DestinationPath CRAIC-windows.zip

      - name: Package (Linux → .tar.gz)
        if: runner.os == 'Linux'
        run: tar -czf CRAIC-linux.tar.gz -C dist CRAIC

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CRAIC-macos.dmg
            CRAIC-windows.zip
            CRAIC-linux.tar.gz
          fail_on_unmatched_files: false
